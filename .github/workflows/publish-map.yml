name: Publish Rails to Relics map
on:
  push:
    paths:
      - 'web-map/**'
      - '.github/workflows/publish-map.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rails-to-relics-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate public snapshot and map behavior
        run: |
          python3 web-map/tools/validate_site.py web-map/site
          node --check web-map/site/app.js
          node --check web-map/site/layer-controls.js
          node web-map/tests/test_layer_controls.cjs
          node web-map/tests/test_layer_activation_order.cjs
          node web-map/tests/test_static_loading.cjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public map
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web-map/site
      - name: Deploy map
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
